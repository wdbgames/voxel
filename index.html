<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Voxel</title>
		<style>
			body {
				margin: 0;
				padding: 0;
				overflow: hidden;
				background: black;
				position: relative;
			}
			.info {
				position: absolute;
			}
			.gui {
				font-family: Arial;
				font-size: 16px;
				color: black;
				user-select: none;
				position: relative;
			}
			.title {
				color: white;
				font-size: 64px;
				padding-left: 16px;
			}
			.button {
				border-radius: 0px 8px 8px 0px;
				border: 4px solid black;
				width: 50%;
				height: 64px;
				padding-left: 16px;
				margin-top: 8px;
				margin-bottom: 8px;
				font-size: 32px;
				background-color: white;
				text-align: left;
				line-height: 64px;;
				border-left: none;
			}
			.button:hover {
				background: gray;
			}
			.disabled {
				background: gray;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas>
		<script type="module" src="./main.js"></script>
	</body>
</html>
