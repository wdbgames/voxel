<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Voxel</title>
		<style>
			body {
				margin: 0; 
				overflow: hidden;
			}
			.ui {
				position: absolute; 
				top: 0; 
				left: 0; 
				width: 100%; 
				height: 100%; 
				pointer-events: none;
				user-select: none;
				color: black;
				font-family: Arial;
				font-size: 16px;
			}
			.info {
				position: absolute;
				top: 2px;
				left: 2px;
			}
			.crosshair {
				position: absolute; 
            	top: 50%; 
            	left: 50%;
				transform: translate(-50%, -50%);
			}
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas>

		<!-- MOVE CREATION TO RENDERER.JS -->
		<div id="ui" class="ui">
			<div id="info" class="info">
				<span id="version"></span>
				<div id="debug" class="debug">
					<br>
					<span id="positionX"></span><br>
					<span id="positionY"></span><br>
					<span id="positionZ"></span><br>
					<br>
					<span id="onGround"></span><br>
					<span id="fly"></span><br>
					<span id="noclip"></span><br>
					<br>
					<span id="chunkUpdates"></span><br>
					<span id="tileUpdates"></span><br>
				</div>
			</div>
			<div id="crosshair" class="crosshair">+</div>
		</div>
		<script type="module" src="./main.js"></script>
	</body>
</html>
